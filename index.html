
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth OS v2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
<aside class="sidebar">
<h2>Wealth OS</h2>
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('updates')">Aggiornamenti</button>
<button onclick="show('finance')">Entrate/Uscite</button>
</aside>

<main>
<section id="dashboard">
<h2>Dashboard</h2>
<p>Net Worth: <span id="nw">0</span> €</p>
</section>

<section id="updates" style="display:none">
<h2>Aggiornamento mensile</h2>

<h3>Portfolio</h3>
<input id="nwInput" placeholder="Net Worth">
<input id="cfInput" placeholder="Cash Flow">
<button onclick="savePortfolio()">Salva</button>

<h3>Allocation</h3>
<input id="stocks" placeholder="Stocks">
<input id="commodities" placeholder="Commodities">
<input id="cash" placeholder="Cash">
<button onclick="saveAlloc()">Salva</button>

</section>

<section id="finance" style="display:none">
<h2>Entrate/Uscite</h2>
<input id="amount" placeholder="Importo">
<select id="type">
<option value="income">Entrata</option>
<option value="expense">Uscita</option>
</select>
<button onclick="addTx()">Aggiungi</button>
<ul id="list"></ul>
</section>
</main>
</div>

<script src="app.js"></script>
</body>
</html>
