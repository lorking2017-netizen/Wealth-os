<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wealth OS Terminal</title>
  <link rel="stylesheet" href="style.css?v=terminalnav1" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>Wealth OS Terminal</h1>
        <p>Portfolio intelligence, allocation e cash flow</p>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="portfolio">Portfolio Engine</button>
        <button class="nav-btn" data-view="allocation">Asset Allocation</button>
        <button class="nav-btn" data-view="annual">Assets 2024-2026</button>
        <button class="nav-btn" data-view="positions">Posizioni</button>
        <button class="nav-btn" data-view="watchlist">Watchlist</button>
        <button class="nav-btn" data-view="sterline">Sterline</button>
        <button class="nav-btn" data-view="finance">Entrate / Uscite</button>
        <button class="nav-btn" data-view="updates">Aggiornamenti</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="viewTitle">Dashboard</h2>
          <p id="viewSubtitle">Prima versione completa della tua web app finanziaria.</p>
        </div>
      </header>

      <section class="top-navigation">
        <div class="nav-group">
          <label class="top-nav-label" for="primaryNav">Navigazione principale</label>
          <select id="primaryNav" class="top-nav-select">
            <option value="dashboard">Dashboard</option>
            <option value="portfolio">Portfolio Engine</option>
            <option value="allocation">Asset Allocation</option>
            <option value="annual">Assets 2024-2026</option>
            <option value="positions">Posizioni</option>
            <option value="watchlist">Watchlist</option>
            <option value="sterline">Sterline</option>
            <option value="finance">Entrate / Uscite</option>
            <option value="updates">Aggiornamenti</option>
          </select>
        </div>
        <div class="nav-group">
          <label class="top-nav-label" for="quickYearNav">Vai a un anno / blocco</label>
          <select id="quickYearNav" class="top-nav-select">
            <option value="">Seleziona vista rapida</option>
            <option value="annual:2024">Assets 2024</option>
            <option value="annual:2025">Assets 2025</option>
            <option value="annual:2026">Assets 2026</option>
            <option value="sterline:2024">Sterline 2024</option>
            <option value="sterline:2025">Sterline 2025</option>
            <option value="sterline:2026">Sterline 2026</option>
          </select>
        </div>
      </section>

      <section id="dashboard" class="view active"></section>
      <section id="portfolio" class="view"></section>
      <section id="allocation" class="view"></section>
      <section id="annual" class="view"></section>
      <section id="positions" class="view"></section>
      <section id="watchlist" class="view"></section>
      <section id="sterline" class="view"></section>
      <section id="finance" class="view"></section>
      <section id="updates" class="view"></section>
    </main>
  </div>

  <script src="data.js?v=terminalnav1"></script>
  <script src="app.js?v=terminalnav1"></script>
</body>
</html>
