<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wealth OS Bank Desk Professional</title>
  <link rel="stylesheet" href="style.css?v=financefix2" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>Wealth OS Bank Desk</h1>
        <p>Allocation, reporting e monitoraggio patrimoniale</p>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="portfolio">Portfolio Engine</button>
        <button class="nav-btn" data-view="allocation">Asset Allocation</button>
        <button class="nav-btn" data-view="annual">Assets 2024-2026</button>
        <button class="nav-btn" data-view="positions">Posizioni</button>
        <button class="nav-btn" data-view="watchlist">Watchlist</button>
        <button class="nav-btn" data-view="sterline">Sterline</button>
        <button class="nav-btn" data-view="finance">Entrate / Uscite</button>
        <button class="nav-btn" data-view="updates">Aggiornamenti</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-block">
          <div class="eyebrow">Bank Terminal</div>
          <h2 id="viewTitle">Dashboard</h2>
          <p id="viewSubtitle">Prima versione completa della tua web app finanziaria.</p>
        </div>
        <div class="quick-nav">
          <div class="quick-nav-group">
            <label for="quickSection">Sezione</label>
            <select id="quickSection">
              <option value="dashboard">Dashboard</option>
              <option value="portfolio">Portfolio Engine</option>
              <option value="allocation">Asset Allocation</option>
              <option value="annual">Assets 2024-2026</option>
              <option value="positions">Posizioni</option>
              <option value="watchlist">Watchlist</option>
              <option value="sterline">Sterline</option>
              <option value="finance">Entrate / Uscite</option>
              <option value="updates">Aggiornamenti</option>
            </select>
          </div>
          <div class="quick-nav-group">
            <label for="quickYear">Navigazione rapida</label>
            <select id="quickYear">
              <option value="">Vai a...</option>
              <option value="annual:2024">Assets 2024</option>
              <option value="annual:2025">Assets 2025</option>
              <option value="annual:2026">Assets 2026</option>
              <option value="sterline:2024">Sterline 2024</option>
              <option value="sterline:2025">Sterline 2025</option>
              <option value="sterline:2026">Sterline 2026</option>
            </select>
          </div>
        </div>
      </header>

      <section id="dashboard" class="view active"></section>
      <section id="portfolio" class="view"></section>
      <section id="allocation" class="view"></section>
      <section id="annual" class="view"></section>
      <section id="positions" class="view"></section>
      <section id="watchlist" class="view"></section>
      <section id="sterline" class="view"></section>
      <section id="finance" class="view"></section>
      <section id="updates" class="view"></section>
    </main>
  </div>

  <script src="data.js?v=financefix2"></script>
  <script src="app.js?v=financefix2"></script>

<script>
window.addEventListener('load', () => {
  const sectionSelect = document.getElementById('quickSection');
  const yearSelect = document.getElementById('quickYear');

  const syncSection = () => {
    if (typeof setView !== 'function') return;
    const currentTitle = document.getElementById('viewTitle')?.textContent || '';
    const map = {
      'Dashboard': 'dashboard',
      'Portfolio Engine': 'portfolio',
      'Asset Allocation': 'allocation',
      'Assets 2024-2026': 'annual',
      'Posizioni': 'positions',
      'Watchlist': 'watchlist',
      'Sterline': 'sterline',
      'Entrate / Uscite': 'finance',
      'Aggiornamenti': 'updates'
    };
    if (sectionSelect && map[currentTitle]) sectionSelect.value = map[currentTitle];
  };

  if (sectionSelect) {
    sectionSelect.addEventListener('change', () => {
      if (typeof setView === 'function') setView(sectionSelect.value);
    });
  }

  if (yearSelect) {
    yearSelect.addEventListener('change', () => {
      if (!yearSelect.value || typeof setView !== 'function') return;
      const [view, year] = yearSelect.value.split(':');
      setView(view);
      setTimeout(() => {
        const tabSelector = view === 'annual' ? '#annualTabs .chip' : '#sterlineTabs .chip';
        document.querySelectorAll(tabSelector).forEach(chip => {
          if (chip.dataset.year === year) chip.click();
        });
      }, 80);
    });
  }

  syncSection();
});
</script>

</body>
</html>
